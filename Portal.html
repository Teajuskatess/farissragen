<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Website Sedang Dibenahi Admin | FARIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2447f8;--blue2:#5c75ff;--lime:#c1f45b;--purple:#7c3aed;
  --ink:#10172b;--muted:#68738a;--line:#e8edf5;--bg:#f8faff;--card:#ffffff;
  --sky1:#eaf0ff;--sky2:#f6f1ff;--road:#2a3350;--hill:#dfe7ff;
}
html{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;overflow-x:hidden}
.wrap{width:min(1100px,92%);margin:auto}
.hero{padding:48px 0 28px;text-align:center}
.tag{display:inline-block;background:var(--lime);color:#14213d;font-weight:800;font-size:12px;padding:7px 14px;border-radius:999px;letter-spacing:.3px}
h1{font-size:clamp(30px,6vw,56px);line-height:1.08;letter-spacing:-1.6px;margin:18px auto 12px;max-width:760px;font-weight:800}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--blue),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--muted);max-width:540px;margin:0 auto;font-size:15px;line-height:1.7}
.scene{margin:30px auto 0;border-radius:28px;overflow:hidden;border:1px solid var(--line);box-shadow:0 24px 60px #2447f81f;background:var(--card);max-width:860px}
.scene svg{display:block;width:100%;height:auto}
footer{text-align:center;color:var(--muted);font-size:12px;padding:30px 0}

/* ===== Animasi ===== */
@keyframes blink{50%{opacity:.25}}
.pick{transform-box:fill-box;transform-origin:50% 100%;animation:swing 1.1s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-55deg)}45%{transform:rotate(25deg)}55%{transform:rotate(25deg)}}
.shovel{transform-box:fill-box;transform-origin:50% 100%;animation:dig 1.6s ease-in-out infinite}
@keyframes dig{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(25deg)}}
.bob{animation:bob 1.1s ease-in-out infinite}
.bob2{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(2.5px)}}
.sign{transform-box:fill-box;transform-origin:50% 100%;animation:sway 2.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.dust{opacity:0;animation:puff 1.1s ease-out infinite}
.dust.b{animation-delay:.35s}.dust.c{animation-delay:.7s}
@keyframes puff{0%{opacity:.7;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(var(--x,10px),-34px) scale(1.5)}}
.spark{opacity:0;animation:spark 1.1s ease-out infinite}
@keyframes spark{0%,40%{opacity:0}50%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.8)}}
.cloud{animation:drift 30s linear infinite}
.cloud.s{animation-duration:45s;animation-delay:-12s}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(720px)}}
.truck{animation:drive 14s linear infinite}
@keyframes drive{from{transform:translateX(-160px)}to{transform:translateX(760px)}}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.patch{transform-box:fill-box;transform-origin:center bottom;animation:fill 6s ease-in-out infinite}
@keyframes fill{0%{transform:scaleY(.1)}70%,100%{transform:scaleY(1)}}
.lamp{animation:blink .9s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.dust,.spark{opacity:.4}}
</style>
</head>
<body>
<main class="wrap hero">
  <span class="tag">🚧 SEDANG DIBENAHI</span>
  <h1>Website sedang <em>dibenahi oleh admin</em></h1>
  <p class="lead">Admin sedang merapikan dan memperbaiki website ini. Mohon bersabar, kami akan segera kembali dengan tampilan yang lebih baik.</p>

  <div class="scene" role="img" aria-label="Animasi tiga pekerja sedang memperbaiki jalan: satu memukul dengan beliung, satu menyekop, satu menjaga rambu">
  <svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--sky1)"/><stop offset="1" stop-color="var(--sky2)"/></linearGradient>
    </defs>
    <rect width="640" height="340" fill="url(#sky)"/>
    <circle cx="540" cy="60" r="28" fill="#c1f45b" opacity=".9"/>
    <g class="cloud" opacity=".85"><ellipse cx="0" cy="60" rx="40" ry="13" fill="#fff" opacity=".8"/><ellipse cx="22" cy="52" rx="24" ry="14" fill="#fff" opacity=".8"/></g>
    <g class="cloud s" opacity=".7"><ellipse cx="0" cy="105" rx="30" ry="10" fill="#fff" opacity=".7"/><ellipse cx="16" cy="98" rx="18" ry="11" fill="#fff" opacity=".7"/></g>
    <path d="M0 215 Q120 150 240 200 T480 190 T640 200 V250 H0Z" fill="var(--hill)"/>
    <!-- jalan -->
    <rect y="235" width="640" height="105" fill="var(--road)"/>
    <rect y="231" width="640" height="6" fill="#8d97b8" opacity=".5"/>
    <g fill="#fff" opacity=".85"><rect x="10" y="296" width="50" height="5" rx="2"/><rect x="100" y="296" width="50" height="5" rx="2"/><rect x="190" y="296" width="50" height="5" rx="2"/><rect x="280" y="296" width="50" height="5" rx="2"/><rect x="370" y="296" width="50" height="5" rx="2"/><rect x="460" y="296" width="50" height="5" rx="2"/><rect x="550" y="296" width="50" height="5" rx="2"/></g>
    <!-- lubang + tambalan -->
    <ellipse cx="305" cy="262" rx="62" ry="13" fill="#0c1021"/>
    <g class="patch"><ellipse cx="305" cy="262" rx="58" ry="11" fill="#3c4670"/><ellipse cx="290" cy="258" rx="22" ry="4" fill="#4a5585"/></g>
    <g fill="#8d97b8"><circle cx="360" cy="270" r="4"/><circle cx="372" cy="274" r="3"/><circle cx="246" cy="274" r="3.5"/></g>

    <!-- truk lewat -->
    <g class="truck" transform="translate(0,0)">
      <g transform="translate(0,300)">
        <rect x="0" y="0" width="62" height="26" rx="5" fill="#f59e0b"/>
        <rect x="62" y="8" width="26" height="18" rx="4" fill="#d97706"/>
        <rect x="68" y="11" width="14" height="8" rx="2" fill="#bfe0ff"/>
        <circle class="lamp" cx="8" cy="-6" r="4" fill="#ff5470"/>
        <g><circle cx="16" cy="28" r="8" fill="#10172b"/><circle class="wheel" cx="16" cy="28" r="3" fill="#8d97b8"/>
        <circle cx="70" cy="28" r="8" fill="#10172b"/><circle class="wheel" cx="70" cy="28" r="3" fill="#8d97b8"/></g>
      </g>
    </g>

    <!-- pekerja 1: beliung -->
    <g transform="translate(205,0)">
      <g class="bob">
        <rect x="-9" y="196" width="7" height="42" rx="3" fill="#2447f8"/>
        <rect x="2" y="196" width="7" height="42" rx="3" fill="#1b36c4"/>
        <rect x="-12" y="236" width="12" height="5" rx="2" fill="#10172b"/><rect x="0" y="236" width="12" height="5" rx="2" fill="#10172b"/>
        <rect x="-13" y="150" width="26" height="50" rx="9" fill="#c1f45b"/>
        <rect x="-13" y="168" width="26" height="5" fill="#14213d" opacity=".25"/>
        <circle cx="0" cy="138" r="11" fill="#f1c9a5"/>
        <path d="M-14 136 a14 12 0 0 1 28 0z" fill="#f59e0b"/><rect x="-16" y="134" width="32" height="4" rx="2" fill="#d97706"/>
        <g transform="translate(6,160)"><g class="pick">
          <line x1="0" y1="0" x2="0" y2="-52" stroke="#9a6b3c" stroke-width="5" stroke-linecap="round"/>
          <path d="M-18 -50 Q0 -64 18 -50 L14 -47 Q0 -56 -14 -47Z" fill="#8d97b8"/>
          <circle cx="0" cy="0" r="6" fill="#f1c9a5"/>
        </g></g>
      </g>
    </g>
    <!-- debu & percikan -->
    <g transform="translate(250,262)">
      <g class="dust" style="--x:-14px"><circle r="6" fill="#aab3d4"/></g>
      <g class="dust b" style="--x:10px"><circle r="5" fill="#aab3d4"/></g>
      <g class="dust c" style="--x:24px"><circle r="7" fill="#aab3d4"/></g>
      <g class="spark"><path d="M0 -10 L3 -2 L11 0 L3 2 L0 10 L-3 2 L-11 0 L-3 -2Z" fill="#c1f45b"/></g>
    </g>

    <!-- pekerja 2: sekop -->
    <g transform="translate(400,0)">
      <g class="bob2">
        <rect x="-9" y="196" width="7" height="42" rx="3" fill="#7c3aed"/>
        <rect x="2" y="196" width="7" height="42" rx="3" fill="#5b21b6"/>
        <rect x="-12" y="236" width="12" height="5" rx="2" fill="#10172b"/><rect x="0" y="236" width="12" height="5" rx="2" fill="#10172b"/>
        <rect x="-13" y="150" width="26" height="50" rx="9" fill="#ff9f43"/>
        <rect x="-13" y="168" width="26" height="5" fill="#fff" opacity=".6"/>
        <circle cx="0" cy="138" r="11" fill="#e0ad86"/>
        <path d="M-14 136 a14 12 0 0 1 28 0z" fill="#c1f45b"/><rect x="-16" y="134" width="32" height="4" rx="2" fill="#9ccc3c"/>
        <g transform="translate(-6,164)"><g class="shovel">
          <line x1="0" y1="0" x2="0" y2="-56" stroke="#9a6b3c" stroke-width="5" stroke-linecap="round"/>
          <path d="M-9 -56 h18 l-3 18 h-12z" fill="#8d97b8" transform="translate(0,-8) scale(1,-1) translate(0,38)"/>
          <circle cx="0" cy="0" r="6" fill="#e0ad86"/>
        </g></g>
      </g>
    </g>

    <!-- pekerja 3: penjaga rambu -->
    <g transform="translate(560,0)">
      <g class="bob2">
        <rect x="-9" y="196" width="7" height="42" rx="3" fill="#2447f8"/>
        <rect x="2" y="196" width="7" height="42" rx="3" fill="#1b36c4"/>
        <rect x="-12" y="236" width="12" height="5" rx="2" fill="#10172b"/><rect x="0" y="236" width="12" height="5" rx="2" fill="#10172b"/>
        <rect x="-13" y="150" width="26" height="50" rx="9" fill="#c1f45b"/>
        <circle cx="0" cy="138" r="11" fill="#f1c9a5"/>
        <path d="M-14 136 a14 12 0 0 1 28 0z" fill="#f59e0b"/><rect x="-16" y="134" width="32" height="4" rx="2" fill="#d97706"/>
        <g class="sign" transform="translate(-22,160)">
          <line x1="0" y1="10" x2="0" y2="-58" stroke="#9a6b3c" stroke-width="4"/>
          <circle cx="0" cy="-72" r="17" fill="#d13c4b"/>
          <text x="0" y="-68" font-size="9.5" font-weight="800" text-anchor="middle" fill="#fff" font-family="Plus Jakarta Sans,sans-serif">PELAN</text>
        </g>
        <rect x="-18" y="156" width="10" height="5" rx="2.5" fill="#f1c9a5"/>
      </g>
    </g>

    <!-- kerucut -->
    <g id="cone"><path d="M130 262 l8 -26 l8 26z" fill="#ff7a3d"/><rect x="132" y="248" width="12" height="4" fill="#fff"/><rect x="124" y="262" width="28" height="5" rx="2" fill="#10172b"/></g>
    <use href="#cone" x="360" y="4"/>
    <use href="#cone" x="-50" y="12"/>
    <!-- pembatas -->
    <g transform="translate(455,270)"><rect x="0" y="0" width="70" height="10" rx="3" fill="#fff"/><g fill="#d13c4b"><path d="M6 0h10l-6 10H0z"/><path d="M26 0h10l-6 10H20z"/><path d="M46 0h10l-6 10H40z"/></g><rect x="6" y="10" width="4" height="12" fill="#8d97b8"/><rect x="60" y="10" width="4" height="12" fill="#8d97b8"/></g>
  </svg>
  </div>

  <footer>© 2026 Portal FARIS · Terima kasih atas kesabaran Anda</footer>
</main>
</body>
</html>
